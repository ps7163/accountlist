<title>账号簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 企业后台结构（参考飞书管理后台）—— 左侧导航 + 顶栏 + 灰底白卡片；表格为主，抽屉看详情，弹窗做表单。 */
:root{
  --bg:#F2F3F5; --panel:#FFFFFF; --fill:#F5F6F7; --hover:#EFF0F1; --press:#E4E5E7;
  --text:#1F2329; --text-2:#646A73; --text-3:#8F959E; --text-4:#BBBFC4;
  --border:#DEE0E3; --divider:#E8E9EB; --ctrl:#D0D3D6;
  --primary:#3370FF; --primary-hover:#4E83FD; --primary-press:#245BDB; --primary-soft:#E1EAFF; --primary-text:#245BDB; --on-primary:#FFFFFF;
  --green:#2EA121; --green-soft:#D9F5D6; --green-text:#237B19;
  --orange:#FF8800; --orange-soft:#FEEAD2; --orange-text:#B26206; --orange-bg:#FFF5EB; --orange-line:#FFD7AD;
  --red:#F54A45; --red-soft:#FDE2E2; --red-text:#D83931;
  --purple:#7F3BF5; --purple-soft:#ECE2FE; --purple-text:#6425D0;
  --gray-soft:#EFF0F1; --gray-text:#646A73;
  --c1:#3370FF; --c1-soft:#ADC6FF; --c2:#FF8800; --c3:#14A8A0; --c4:#7F3BF5; --c5:#D6457E; --c6:#8F959E;
  --blue:#3370FF; --blue-soft:#E1EAFF;
  --glass:rgba(255,255,255,.62); --glass-side:rgba(255,255,255,.8); --glass-line:rgba(31,35,41,.06);
  --card-line:#EBECEE; --card-shadow:0 1px 2px rgba(31,35,41,.04),0 2px 12px rgba(31,35,41,.04); --skin-op:1;
  --shadow:0 4px 8px rgba(31,35,41,.03),0 3px 6px -6px rgba(31,35,41,.05),0 6px 18px 6px rgba(31,35,41,.03);
  --shadow-lg:0 6px 24px rgba(31,35,41,.08),0 8px 16px -8px rgba(31,35,41,.06);
  --mask:rgba(31,35,41,.4);
  --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Tahoma,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --panel:#1F1F1F; --fill:#292929; --hover:#2E2E2E; --press:#373737;
  --text:#EBEBEB; --text-2:#A6A6A6; --text-3:#757575; --text-4:#5F5F5F;
  --border:#373737; --divider:#2E2E2E; --ctrl:#4A4A4A;
  --primary:#4C88FF; --primary-hover:#6B9CFF; --primary-press:#3A73E8; --primary-soft:#1B2A4D; --primary-text:#82A7FC; --on-primary:#FFFFFF;
  --green:#51BA43; --green-soft:#1C3319; --green-text:#7DCB6F;
  --orange:#F5952D; --orange-soft:#3D2A12; --orange-text:#F8AE5B; --orange-bg:#2A2014; --orange-line:#5C4020;
  --red:#F76964; --red-soft:#3F1D1C; --red-text:#F98E8B;
  --purple:#9F6FF1; --purple-soft:#2B1F45; --purple-text:#B793F5;
  --gray-soft:#2E2E2E; --gray-text:#A6A6A6;
  --c1:#4C88FF; --c1-soft:#2D4A85; --c2:#C97316; --c3:#1FA398; --c4:#9F6FF1; --c5:#D65C92; --c6:#757575;
  --blue:#4C88FF; --blue-soft:#1B2A4D;
  --glass:rgba(31,31,31,.6); --glass-side:rgba(31,31,31,.82); --glass-line:rgba(255,255,255,.06);
  --card-line:#2A2A2A; --card-shadow:none; --skin-op:.22;
  --shadow:0 2px 8px rgba(0,0,0,.3); --shadow-lg:0 8px 28px rgba(0,0,0,.45); --mask:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --panel:#1F1F1F; --fill:#292929; --hover:#2E2E2E; --press:#373737;
  --text:#EBEBEB; --text-2:#A6A6A6; --text-3:#757575; --text-4:#5F5F5F;
  --border:#373737; --divider:#2E2E2E; --ctrl:#4A4A4A;
  --primary:#4C88FF; --primary-hover:#6B9CFF; --primary-press:#3A73E8; --primary-soft:#1B2A4D; --primary-text:#82A7FC; --on-primary:#FFFFFF;
  --green:#51BA43; --green-soft:#1C3319; --green-text:#7DCB6F;
  --orange:#F5952D; --orange-soft:#3D2A12; --orange-text:#F8AE5B; --orange-bg:#2A2014; --orange-line:#5C4020;
  --red:#F76964; --red-soft:#3F1D1C; --red-text:#F98E8B;
  --purple:#9F6FF1; --purple-soft:#2B1F45; --purple-text:#B793F5;
  --gray-soft:#2E2E2E; --gray-text:#A6A6A6;
  --c1:#4C88FF; --c1-soft:#2D4A85; --c2:#C97316; --c3:#1FA398; --c4:#9F6FF1; --c5:#D65C92; --c6:#757575;
  --blue:#4C88FF; --blue-soft:#1B2A4D;
  --glass:rgba(31,31,31,.6); --glass-side:rgba(31,31,31,.82); --glass-line:rgba(255,255,255,.06);
  --card-line:#2A2A2A; --card-shadow:none; --skin-op:.22;
  --shadow:0 2px 8px rgba(0,0,0,.3); --shadow-lg:0 8px 28px rgba(0,0,0,.45); --mask:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-hover)}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;display:block}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;position:relative;isolation:isolate}
.skin{position:absolute;inset:0 0 auto 0;height:300px;z-index:-1;background-size:cover;background-position:center top;background-repeat:no-repeat;opacity:var(--skin-op);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);pointer-events:none}
.side{position:sticky;top:0;height:100vh;background:var(--glass-side);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--glass-line);display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);z-index:25}
.logo-row{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;font-weight:600;font-size:16px}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center}
.logo-mark svg{width:15px;height:15px}
.menu{padding:8px;display:grid;gap:2px}
.menu-label{font-size:12px;color:var(--text-3);padding:12px 12px 4px}
.m-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:6px;border:0;background:none;width:100%;cursor:pointer;color:var(--text);text-align:left}
.m-item .i{color:var(--text-2)}
.m-item:hover{background:var(--hover)}
.m-item[aria-current="page"]{background:var(--primary-soft);color:var(--primary-text);font-weight:500}
.m-item[aria-current="page"] .i{color:var(--primary)}
.m-badge{margin-left:auto;background:var(--red);color:#fff;font-size:12px;line-height:16px;border-radius:8px;padding:0 5px;min-width:16px;text-align:center}
.side-foot{margin-top:auto;padding:12px 20px;border-top:1px solid var(--divider);display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}

.mainc{min-width:0;display:flex;flex-direction:column}
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;background:var(--glass);backdrop-filter:saturate(1.4) blur(20px);-webkit-backdrop-filter:saturate(1.4) blur(20px);border-bottom:1px solid var(--glass-line);display:flex;align-items:center;gap:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.crumb{display:flex;align-items:center;gap:6px;color:var(--text-3);min-width:0}
.crumb b{color:var(--text);font-weight:600;font-size:16px}
.h-r{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;width:32px;height:32px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn .dot{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:10px;line-height:14px;min-width:14px;padding:0 3px;border-radius:7px}
.burger{display:none}

.content{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

/* ---------- primitives ---------- */
.card{background:var(--panel);border-radius:12px;border:1px solid var(--card-line);box-shadow:var(--card-shadow);min-width:0}
.card-h{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:16px;font-weight:600}
.card-h .ex{font-size:12px;color:var(--text-3)}
.card-b{padding:0 24px 16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 15px;border-radius:6px;border:1px solid var(--ctrl);background:var(--panel);cursor:pointer;white-space:nowrap;font-size:14px;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--press)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-primary:active{background:var(--primary-press)}
.btn-sm{height:28px;padding:0 11px;font-size:13px}
.btn-text{border:0;background:none;color:var(--primary);padding:0 4px;height:auto;font-size:14px;cursor:pointer}
.btn-text:hover{background:none;color:var(--primary-hover)}
.btn-text.danger{color:var(--red)}
.btn .i{width:14px;height:14px}

.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:12px;line-height:20px;white-space:nowrap;font-weight:500}
.tg-blue{background:var(--primary-soft);color:var(--primary-text)}
.tg-green{background:var(--green-soft);color:var(--green-text)}
.tg-orange{background:var(--orange-soft);color:var(--orange-text)}
.tg-red{background:var(--red-soft);color:var(--red-text)}
.tg-purple{background:var(--purple-soft);color:var(--purple-text)}
.tg-gray{background:var(--gray-soft);color:var(--gray-text)}

.blogo{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}
.blogo.md{width:32px;height:32px;border-radius:8px;font-size:14px}
.blogo.lg{width:40px;height:40px;border-radius:8px;font-size:18px}
.blogo.xs{width:16px;height:16px;border-radius:4px;font-size:9px}

.inp,.sel{height:32px;border:1px solid var(--ctrl);border-radius:6px;background:var(--panel);padding:0 11px;min-width:0;transition:border-color .15s}
.inp:hover,.sel:hover{border-color:var(--primary)}
.inp:focus,.sel:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.search{display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--ctrl);border-radius:6px;background:var(--panel);padding:0 10px;width:260px;max-width:100%}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.search .i{color:var(--text-3)}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}

/* alert */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-radius:10px;border:1px solid var(--orange-line);background:var(--orange-bg)}
.alert .i{color:var(--orange);margin-top:3px}
.alert .grow{flex:1;min-width:0}
.alert b{font-weight:600}
.alert.ok{border-color:var(--green-soft);background:var(--green-soft)}
.alert.ok .i{color:var(--green)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:18px 24px;border-left:1px solid var(--divider);min-width:0}
.stat:first-child{border-left:0}
.stat .l{color:var(--text-2);font-size:14px;display:flex;align-items:center;gap:6px}
.stat .v{font-size:28px;line-height:40px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat .v small{font-size:14px;font-weight:400;color:var(--text-2);margin-left:2px;letter-spacing:0}
.stat .s{font-size:12px;color:var(--text-3)}

.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--text-2);background:var(--fill);height:40px;padding:0 12px;white-space:nowrap;border-bottom:1px solid var(--divider)}
.tbl td{padding:12px;border-bottom:1px solid var(--divider);vertical-align:middle;white-space:nowrap}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--fill)}
.tbl tr.sel td{background:var(--primary-soft)}
.tbl th:first-child,.tbl td:first-child{padding-left:24px}
.tbl th:last-child,.tbl td:last-child{padding-right:24px}
.tbl .r{text-align:right}
.tbl .svc{display:flex;align-items:center;gap:10px}
.tbl .sub{font-size:12px;color:var(--text-3);line-height:18px}
.tbl .ops{display:flex;gap:12px}
.tbl .sticky-r{position:sticky;right:0;background:var(--panel);box-shadow:-6px 0 8px -6px rgba(31,35,41,.12)}
.tbl th.sticky-r{background:var(--fill)}
.tbl.compact td{padding:10px 12px}
input[type=checkbox].ck{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;margin:0;vertical-align:middle}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;color:var(--text-2);font-size:13px;flex-wrap:wrap}
.pager{display:flex;gap:4px;align-items:center}
.pager button{min-width:28px;height:28px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;color:var(--text-2);display:grid;place-items:center}
.pager button[aria-current="page"]{border-color:var(--primary);color:var(--primary);font-weight:500}
.pager button:hover:not([disabled]):not([aria-current]){background:var(--hover)}
.pager button[disabled]{color:var(--text-4);cursor:not-allowed}
.pager .ellip{min-width:20px;text-align:center;color:var(--text-3)}
.pager-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.empty{padding:48px 20px;text-align:center;color:var(--text-3)}

/* tabs + toolbar */
.tabs{display:flex;gap:28px;padding:0 20px;border-bottom:1px solid var(--divider);overflow-x:auto}
.tab{border:0;background:none;height:46px;cursor:pointer;color:var(--text-2);position:relative;white-space:nowrap;padding:0;display:flex;align-items:center;gap:4px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--primary);font-weight:500}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary);border-radius:2px}
.tab .n{font-size:12px;color:var(--text-3)}
.tab[aria-selected="true"] .n{color:var(--primary)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 20px}
.toolbar .sp{flex:1}
.batch{display:flex;align-items:center;gap:16px;padding:8px 20px;background:var(--primary-soft);color:var(--primary-text);font-size:13px;flex-wrap:wrap}

/* bars */
.bars{display:grid;gap:14px}
.bar-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--divider);border-left:1px solid var(--divider)}
.cal .wd{font-size:12px;color:var(--text-3);padding:6px 8px;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);background:var(--fill)}
.day{min-height:96px;padding:4px 6px;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);background:var(--panel);display:flex;flex-direction:column;gap:3px;min-width:0}
.day .n{font-size:12px;color:var(--text-2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--primary);color:#fff}
.day.out{background:var(--fill)}
.chip{display:flex;align-items:center;gap:4px;font-size:12px;line-height:18px;border-radius:4px;padding:1px 4px;background:var(--primary-soft);color:var(--primary-text);min-width:0;border:0;cursor:pointer;text-align:left;width:100%}
.chip.paid{background:var(--gray-soft);color:var(--text-3)}
.chip.trial{background:var(--purple-soft);color:var(--purple-text)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:12px;color:var(--text-3);padding-left:4px}

/* list items */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider);cursor:pointer}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li:hover .nm{color:var(--primary)}

/* mobile list */
.mlist{display:none}
.mcard{padding:14px 16px;border-bottom:1px solid var(--divider);display:grid;gap:6px;cursor:pointer}
.mcard .top{display:flex;align-items:center;gap:10px}
.mcard .top .grow{flex:1;min-width:0}
.mcard .meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--text-2);min-width:0}

/* drawer & modal */
.mask{position:fixed;inset:0;background:var(--mask);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--divider);flex:none}
.dr-h h2{margin:0;font-size:16px;font-weight:600}
.dr-b{flex:1;overflow:auto;padding:20px 24px;display:grid;gap:24px;align-content:start}
.dr-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 24px;border-top:1px solid var(--divider);flex:none;flex-wrap:wrap}
.d-top{display:flex;gap:14px;align-items:center}
.d-top h3{margin:0;font-size:18px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-t{font-size:14px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary)}
.desc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;margin:0}
.desc div{min-width:0}
.desc dt{font-size:12px;color:var(--text-3);line-height:18px}
.desc dd{margin:2px 0 0;overflow-wrap:anywhere}
.desc .full{grid-column:1/-1}
.trial-box{background:var(--purple-soft);color:var(--purple-text);border-radius:6px;padding:8px 12px;font-size:13px}

.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 32px));max-height:calc(100% - 64px);background:var(--panel);border-radius:8px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.md-b{overflow:auto;padding:4px 24px 20px}
.form-sec{font-size:14px;font-weight:600;margin:16px 0 12px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.f{display:grid;gap:6px;min-width:0;align-content:start}
.f.full{grid-column:1/-1}
.f>label,.f .lab{font-size:14px;color:var(--text)}
.req::before{content:"* ";color:var(--red)}
.f .inp,.f .sel,.f textarea{width:100%}
.f textarea{border:1px solid var(--ctrl);border-radius:6px;background:var(--panel);padding:6px 11px;min-height:64px;resize:vertical}
.f textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.hint{font-size:12px;color:var(--text-3)}

function paged(key, rows, size) {
  const st = pg[key] || (pg[key] = { page:1, size });
  const pages = Math.max(1, Math.ceil(rows.length / st.size));
  if (st.page > pages) st.page = pages;
  return { items: rows.slice((st.page - 1) * st.size, st.page * st.size), page: st.page, size: st.size, pages, total: rows.length };
}
function pagerNav(key, p) {
  if (p.pages <= 1) return '';
  const nums = [];
  for (let i = 1; i <= p.pages; i++) if (i === 1 || i === p.pages || Math.abs(i - p.page) <= 1) nums.push(i); else if (nums[nums.length - 1] !== '…') nums.push('…');
  return `<div class="pager"><button data-pg="${key}" data-p="${p.page - 1}" ${p.page === 1 ? 'disabled' : ''} aria-label="上一页">${I('left')}</button>${nums.map(n => n === '…' ? '<span class="ellip">…</span>' : `<button data-pg="${key}" data-p="${n}" ${n === p.page ? 'aria-current="page"' : ''}>${n}</button>`).join('')}<button data-pg="${key}" data-p="${p.page + 1}" ${p.page === p.pages ? 'disabled' : ''} aria-label="下一页">${I('right')}</button></div>`;
}
function pager(key, p, left) {
  return `<div class="tbl-foot"><span>${left || `共 ${p.total} 条`}</span><div class="pager-wrap">${pagerNav(key, p)}<select class="sel" style="height:28px" data-pgsize="${key}" aria-label="每页条数">${[10, 20, 50].map(n => `<option value="${n}" ${n === p.size ? 'selected' : ''}>${n} 条/页</option>`).join('')}</select></div></div>`;
}

function state(s) {
  const R = settings.remindDays;
  if (s.kind === 'free') return { label:'仅注册', tone:'gray', group:'free' };
  if (s.kind === 'once') return { label:'已买断', tone:'gray', group:'once' };
  if (s.status === 'cancelled') return { label:'已取消', tone:'gray', group:'ended' };
  if (s.status === 'expired') return { label:'已过期', tone:'red', group:'ended' };
  if (s.trialEnd) {
    const d = diff(s.trialEnd);
    if (d < 0) return { label:'试用已结束', tone:'red', group:'trial', alert:true, d };
    return { label:`试用中 · 剩 ${d} 天`, tone: d <= R ? 'orange' : 'purple', group:'trial', alert: d <= R, d };
  }
  const d = diff(s.next);
  if (d < 0) return { label:`已过期 ${-d} 天`, tone:'red', group:'active', alert:true, d };
  if (d <= R) return { label: d === 0 ? '今天到期' : `${d} 天后到期`, tone:'orange', group:'active', alert:true, d };
  return { label:'使用中', tone:'green', group:'active', d };
}

function monthTotals() {
  const out = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1), y = d.getFullYear(), m = d.getMonth();
    let paid = 0, due = 0;
    subs.forEach(s => s.history.forEach(h => { if (h.date.getFullYear() === y && h.date.getMonth() === m && h.date <= TODAY) paid += h.amount; }));
    if (i === 0) Object.values(eventsIn(y, m)).flat().forEach(e => { if (e.type !== 'paid') due += e.amount; });
    out.push({ y, m, paid, due });
  }
  return out;
}
function trendChart(data) {
  const W = 640, H = 220, L = 48, R = 8, T = 12, B = 28;
  const max = Math.max(...data.map(d => d.paid + d.due));
  const step = [100, 200, 250, 500, 1000, 2000, 2500, 5000].find(s => max / s <= 4) || 5000;
  const top = Math.ceil(max / step) * step || step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const band = (W - L - R) / data.length, bw = Math.min(26, band * .5);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)" ${v ? 'stroke-dasharray="3 4"' : ''}/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
  const bar = (x, y0, y1, fill, roundTop) => { const h = y0 - y1; if (h <= 0) return ''; return roundTop && h > 4 ? `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="4" fill="${fill}"/><rect x="${x}" y="${y0 - Math.min(4, h)}" width="${bw}" height="${Math.min(4, h)}" fill="${fill}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${fill}"/>`; };
  data.forEach((d, i) => {
    const x = L + band * i + (band - bw) / 2, cur = i === data.length - 1;
    const yp = y(d.paid), yd = y(d.paid + d.due);
    g += bar(x, y(0), yp, 'var(--c1)', !d.due);
    if (d.due) g += bar(x, yp - (d.paid ? 2 : 0), yd, 'var(--c1-soft)', true);
    g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${cur ? 'var(--text)' : 'var(--text-3)'}" ${cur ? 'font-weight="600"' : ''}>${d.m + 1}月</text>`;
    g += `<rect x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent" data-tip="${d.y}年${d.m + 1}月｜已支出 ${yuan(d.paid)}${d.due ? '｜待扣费 ' + yuan(d.due) : ''}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="近 12 个月支出柱状图">${g}</svg>`;
}
function donut(cats, total) {
  const r = 58, c = 2 * Math.PI * r; let off = 0;
  const segs = cats.map(([n, v], i) => { const len = v / total * c, seg = `<circle r="${r}" cx="80" cy="80" fill="none" stroke="var(--c${Math.min(i + 1, 6)})" stroke-width="18" stroke-dasharray="${Math.max(len - 2, .5)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)" data-tip="${esc(n)}｜${yuan0(v)}/月｜${(v / total * 100).toFixed(0)}%"/>`; off += len; return seg; }).join('');
  return `<svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="月支出构成环形图"><circle r="${r}" cx="80" cy="80" fill="none" stroke="var(--fill)" stroke-width="18"/>${segs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--text-3)">每月合计</text><text x="80" y="96" text-anchor="middle" font-size="18" font-weight="600" fill="var(--text)">${yuan0(total)}</text></svg>`;
}

/* ---------- 账号安全 ---------- */
function risks() {
  const r = [];
  emails.forEach(e => { if (!e.recovery) r.push({ lv:'high', t:`${e.addr} 没有设置辅助邮箱`, d:'忘记密码或被盗时可能无法找回。建议绑定一个其他服务商的邮箱作为辅助邮箱。', mail:e.id }); });
  emails.forEach(a => { const b = emails.find(x => x.addr === a.recovery); if (b && b.recovery === a.addr && a.id < b.id) r.push({ lv:'mid', t:`${a.addr} 和 ${b.addr} 互为辅助邮箱`, d:'两个邮箱同时出问题时都无法找回。建议其中一个改用第三个邮箱或手机号找回。' }); });
  const byPhone = {}; emails.forEach(e => { if (e.phone) (byPhone[e.phone] = byPhone[e.phone] || []).push(e); });
  Object.entries(byPhone).forEach(([ph, es]) => { if (es.length > 1) r.push({ lv:'mid', t:`${es.length} 个邮箱绑定了同一个手机号 ${maskPhone(ph)}`, d:`${es.map(e => e.addr).join('、')}。这个号码停用或丢失后，这些邮箱都无法用短信找回。` }); });
  payAlerts().forEach(p => r.push({ lv:'mid', t:`${p.name} 将于 ${ym(p.expire)} 到期`, d:`绑定了 ${subsOfPay(p).length} 个订阅，换卡后需要逐个更新付款方式。`, pay:p.id }));
  emails.forEach(e => { const g = subs.filter(s => s.email === e.id && s.login === 'google' && s.status === 'active'); if (e.provider === 'Gmail' && g.length >= 3) r.push({ lv:'low', t:`${g.length} 个服务用 ${e.addr} 做 Google 一键登录`, d:`这个 Gmail 一旦丢失，${g.slice(0, 5).map(s => s.name).join('、')} 等服务都登录不了。请确保它的辅助邮箱和两步验证可用。` }); });
  const nm = subs.filter(s => s.kind !== 'free' && s.status === 'active' && s.mfa === 'none');
  if (nm.length) r.push({ lv:'low', t:`${nm.length} 个付费服务没有开启两步验证`, d:`${nm.slice(0, 6).map(s => s.name).join('、')}${nm.length > 6 ? ' 等' : ''}。付费账号被盗会直接产生损失，建议开启。` });
  return r;
}
const LV = { high:['高风险', 'red'], mid:['中风险', 'orange'], low:['建议', 'blue'] };
function graph() {
  const W = 900, H = 270, ex = i => 120 + i * (W - 240) / Math.max(1, emails.length - 1), EY = 110;
  const avg = ph => { const ix = emails.map((e, i) => e.phone === ph ? i : -1).filter(i => i >= 0); return ix.reduce((a, b) => a + b, 0) / ix.length; };
  const phones = [...new Set(emails.map(e => e.phone).filter(Boolean))].sort((a, b) => avg(a) - avg(b)), px = i => phones.length === 1 ? W / 2 : 200 + i * (W - 400) / (phones.length - 1), PY = 236;
  let g = `<defs><marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--primary)"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker></defs>`;
  emails.forEach((e, i) => { if (e.phone) g += `<line x1="${ex(i)}" y1="${EY + 24}" x2="${px(phones.indexOf(e.phone))}" y2="${PY - 16}" style="stroke:var(--text-4)" stroke-width="1.5"/>`; });
  const done = new Set();
  emails.forEach((a, i) => { const j = emails.findIndex(x => x.addr === a.recovery); if (j < 0 || done.has(i + ':' + j)) return;
    const mutual = emails[j].recovery === a.addr; done.add(j + ':' + i);
    const x1 = ex(i), x2 = ex(j), lift = 40 + Math.abs(x2 - x1) * .12;
    g += `<path d="M${x1} ${EY - 24} Q${(x1 + x2) / 2} ${EY - 24 - lift} ${x2} ${EY - 24}" fill="none" style="stroke:var(--${mutual ? 'red' : 'primary'})" stroke-width="1.8" marker-end="url(#ar-${mutual ? 'r' : 'b'})" ${mutual ? 'marker-start="url(#ar-r)"' : ''}/>`; });
  emails.forEach((e, i) => { const x = ex(i), warn = !e.recovery;
    g += `<g data-tip="${esc(e.addr)}｜辅助邮箱：${esc(e.recovery || '未设置')}｜手机：${esc(maskPhone(e.phone))}"><rect x="${x - 78}" y="${EY - 24}" width="156" height="48" rx="10" style="fill:var(--panel);stroke:var(--${warn ? 'orange' : 'border'})" stroke-width="1.5" ${warn ? 'stroke-dasharray="5 4"' : ''}/>
      <circle cx="${x - 54}" cy="${EY}" r="12" style="fill:${brand(e.provider)}"/><text x="${x - 54}" y="${EY + 4}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">${esc(e.provider[0])}</text>
      <text x="${x - 35}" y="${EY - 2}" font-size="13" font-weight="600" style="fill:var(--text)">${esc(e.addr.split('@')[0].slice(0, 13))}</text><text x="${x - 35}" y="${EY + 14}" font-size="11.5" style="fill:var(--text-3)">${esc(e.provider)}${warn ? ' · 无辅助' : ''}</text></g>`; });
  phones.forEach((p, i) => { const x = px(i), n = emails.filter(e => e.phone === p).length;
    g += `<g data-tip="${esc(maskPhone(p))}｜绑定 ${n} 个邮箱"><rect x="${x - 80}" y="${PY - 16}" width="160" height="32" rx="16" style="fill:var(--fill);stroke:var(--${n > 1 ? 'orange' : 'border'})" stroke-width="1.2"/><text x="${x}" y="${PY + 4}" text-anchor="middle" font-size="12.5" style="fill:var(--text-2)">${esc(maskPhone(p))}</text></g>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="邮箱与手机号的找回关系图">${g}</svg>`;
}

/* ---------- 扣费日历 ---------- */
function eventsIn(y, m) {
  const start = new Date(y, m, 1), end = new Date(y, m + 1, 0), map = {};
  const add = (d, ev) => { (map[d.getDate()] = map[d.getDate()] || []).push(ev); };
  subs.forEach(s => {
    s.history.forEach(h => { if (h.date >= start && h.date <= end) add(h.date, { s, type:'paid', amount:h.amount }); });
    if (isLive(s) && s.next) {
      let d = new Date(s.next), g = 0;
      while (d <= end && g++ < 60) {
        if (d >= start && d >= TODAY) add(d, { s, type: s.trialEnd && sameDay(d, s.trialEnd) ? 'trial' : 'due', amount:s.price });
        if (!s.auto && !s.trialEnd) break;
        d = addCycle(d, s.cycle, 1);
      }
    }
  });
  return map;
}
function vCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const off = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const ev = eventsIn(y, m), all = Object.values(ev).flat();
  const paid = all.filter(e => e.type === 'paid').reduce((a, e) => a + e.amount, 0), due = all.filter(e => e.type !== 'paid').reduce((a, e) => a + e.amount, 0);
  let cells = ['周一','周二','周三','周四','周五','周六','周日'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < off; i++) cells += '<div class="day out"></div>';
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), es = ev[d] || [];
    cells += `<div class="day ${sameDay(dt, TODAY) ? 'today' : ''}"><span class="n num">${d}</span>${es.slice(0, 3).map(e => `<button class="chip ${e.type === 'due' ? '' : e.type}" data-open="${e.s.id}" title="${esc(e.s.name)} ${yuan(e.amount)}">${blogo(e.s.name, 'xs')}<span>${esc(e.s.name)} ¥${e.amount}</span></button>`).join('')}${es.length > 3 ? `<span class="more">还有 ${es.length - 3} 笔</span>` : ''}</div>`;
  }
  const tail = (7 - (off + days) % 7) % 7;
  for (let i = 0; i < tail; i++) cells += '<div class="day out"></div>';
  return `<section class="card"><div class="card-h"><div style="display:flex;align-items:center;gap:6px"><button class="icon-btn" data-cal="-1" aria-label="上个月">${I('left')}</button><h2 class="num">${y} 年 ${m + 1} 月</h2><button class="icon-btn" data-cal="1" aria-label="下个月">${I('right')}</button><button class="btn btn-sm" data-cal="0">今天</button></div>
    <span class="ex hide-m" style="display:flex;gap:12px"><span>已扣 <b class="num" style="color:var(--text)">${yuan(paid)}</b></span><span>待扣 <b class="num" style="color:var(--primary)">${yuan(due)}</b></span></span></div>
    <div class="card-b"><div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">${tag('待扣费', 'blue')}${tag('已扣费', 'gray')}${tag('试用转正', 'purple')}</div><div class="cal">${cells}</div></div></section>`;
}

        <div class="f"><label for="f-manage">管理订阅链接</label><input class="inp" type="url" id="f-manage" value="${esc(s.manage)}" placeholder="取消或更改套餐的页面"></div>
      </div>
      <div class="form-sec">登录与安全</div><div class="fg">
        <div class="f"><label for="f-login">登录方式</label><select class="sel" id="f-login">${Object.entries(LOGINS).map(([k, t]) => `<option value="${k}" ${s.login === k ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="hint">用 Google / Apple 登录的服务会计入「邮箱影响面」</span></div>
        <div class="f"><label for="f-mfa">两步验证</label><select class="sel" id="f-mfa">${Object.entries(MFAS).map(([k, t]) => `<option value="${k}" ${s.mfa === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="form-sec">计费信息</div><div class="fg">
        <div class="f full"><span class="lab">计费方式</span>${radios('f-kind', [['sub','订阅'],['once','一次性买断'],['free','免费 / 仅注册']], s.kind)}</div>
        <div class="f pay"><label for="f-price" class="req">金额</label><div class="affix"><span>¥</span><input class="inp num" type="number" id="f-price" step="0.01" min="0" value="${s.price}" placeholder="0.00" style="width:100%"></div></div>
        <div class="f sub"><span class="lab">计费周期</span>${radios('f-cycle', [['week','周'],['month','月'],['quarter','季'],['year','年']], s.cycle)}</div>
        <div class="f pay"><label for="f-next" id="f-next-lab" class="req">下次扣费日期</label><input class="inp" type="date" id="f-next" value="${fmt(s.trialEnd || s.next || (s.history && s.history[0] ? s.history[0].date : TODAY))}"></div>
        <div class="f sub"><label for="f-status">状态</label><select class="sel" id="f-status"><option value="active" ${s.status === 'active' ? 'selected' : ''}>使用中</option><option value="cancelled" ${s.status === 'cancelled' ? 'selected' : ''}>已取消</option><option value="expired" ${s.status === 'expired' ? 'selected' : ''}>已过期</option></select></div>
        <div class="f sub"><label class="sw"><input type="checkbox" id="f-trial" ${s.trialEnd ? 'checked' : ''}>免费试用中</label><span class="hint">开启后，上方日期填写试用结束日</span></div>
        <div class="f sub"><label class="sw"><input type="checkbox" id="f-auto" ${s.auto ? 'checked' : ''}>自动续费</label><span class="hint">到期后自动顺延一个周期并记录付费</span></div>
      </div>
      <div class="pay"><div class="form-sec">支付信息</div><div class="fg">
        <div class="f"><label for="f-channel">付费渠道</label><select class="sel" id="f-channel">${CHANNELS.map(c => `<option ${s.channel === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="f"><label for="f-pay">支付账号</label><input class="inp" type="text" id="f-pay" value="${esc(s.pay)}" placeholder="如 招行信用卡 尾号 1234" list="pays"><datalist id="pays">${[...new Set(subs.map(x => x.pay).filter(Boolean))].map(p => `<option>${esc(p)}</option>`).join('')}</datalist></div>
      </div></div>
      <div class="form-sec">备注</div><div class="f"><textarea id="f-note" aria-label="备注" placeholder="选填">${esc(s.note)}</textarea></div>
    </div>
    <div class="dr-f"><button type="button" class="btn" data-close>取消</button><button class="btn btn-primary">${id ? '保存' : '创建'}</button></div>
  </form>`);
  const form = document.getElementById('subForm');
  const vis = () => {
    const kind = form.querySelector('[name=f-kind]:checked').value, trial = document.getElementById('f-trial').checked;
    form.querySelectorAll('.pay').forEach(el => el.hidden = kind === 'free');
    form.querySelectorAll('.sub').forEach(el => el.hidden = kind !== 'sub');
    document.getElementById('f-next-lab').textContent = kind === 'once' ? '购买日期' : trial ? '试用结束日期' : '下次扣费日期';
  };
  form.addEventListener('change', vis); vis();
  const nameIn = document.getElementById('f-name'), sug = document.getElementById('f-sug');
  const showSug = () => {
    if (id) return;
    const q = nameIn.value.trim().toLowerCase();
    const list = TEMPLATES.map((t, i) => [t, i]).filter(([t]) => !q || t.name.toLowerCase().includes(q)).slice(0, 6);
    sug.innerHTML = list.length ? `<div class="sug-h">${q ? '匹配的服务模板' : '常用服务 · 选择后自动填写'}</div>` + list.map(([t, i]) => `<button type="button" class="sug-i" data-tpl="${i}">${blogo(t.name)}<span class="grow">${esc(t.name)} <span class="t3">${esc(t.plan)}</span></span><span class="num t2">${yuan0(t.price)}/${UNIT[t.cycle]}</span></button>`).join('') : '';
    sug.hidden = !list.length;
  };
  nameIn.addEventListener('focus', showSug); nameIn.addEventListener('input', showSug);
  nameIn.addEventListener('blur', () => setTimeout(() => { sug.hidden = true; }, 120));
  sug.addEventListener('mousedown', ev => {
    const b = ev.target.closest('[data-tpl]'); if (!b) return;
    ev.preventDefault();
    const t = TEMPLATES[+b.dataset.tpl], set = (k, v) => { document.getElementById(k).value = v; };
    nameIn.value = t.name; set('f-plan', t.plan); set('f-url', t.url); set('f-manage', t.manage); set('f-price', t.price);
    const cat = document.getElementById('f-cat'); if ([...cat.options].some(o => o.value === t.cat)) cat.value = t.cat;
    const cy = document.getElementById('f-cycle-' + t.cycle); if (cy) cy.checked = true;
    sug.hidden = true; toast(`已套用「${t.name}」模板，可继续修改`);
  });
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    const g = id => document.getElementById(id).value.trim();
    const kind = form.querySelector('[name=f-kind]:checked').value, date = new Date(g('f-next') + 'T00:00:00');
    const trial = kind === 'sub' && document.getElementById('f-trial').checked;
    const data = { name:g('f-name'), plan:g('f-plan'), email:g('f-email'), cat:g('f-cat'), url:g('f-url'), manage:g('f-manage'), kind,
      price:kind === 'free' ? 0 : Number(g('f-price')) || 0, cycle:form.querySelector('[name=f-cycle]:checked').value,
      next:kind === 'sub' ? date : null, trialEnd:trial ? date : null, auto:document.getElementById('f-auto').checked,
      status:kind === 'sub' ? g('f-status') : 'active', channel:kind === 'free' ? '' : g('f-channel'), pay:kind === 'free' ? '' : g('f-pay'), note:g('f-note'), login:g('f-login'), mfa:g('f-mfa') };
    if (editing) Object.assign(subs.find(x => x.id === editing), data);
    else subs.push(Object.assign({ id:'s' + (++seq), history: kind === 'once' ? [{ date, amount:data.price }] : [] }, data));
    closeLayer(); render(); toast(editing ? '保存成功' : '创建成功');
  });
}

function openMailForm() {
  layer(`<div class="mask" data-close></div><form class="modal" id="mailForm" role="dialog" aria-label="添加邮箱" style="width:min(520px,calc(100% - 32px))">
    <div class="dr-h"><h2>添加邮箱</h2><button type="button" class="icon-btn" data-close aria-label="关闭">${I('x')}</button></div>
    <div class="md-b"><div class="fg" style="padding-top:16px">
      <div class="f full"><label for="m-addr" class="req">邮箱地址</label><input class="inp" type="text" id="m-addr" required placeholder="name@gmail.com"></div>
      <div class="f"><label for="m-phone">绑定手机</label><input class="inp" type="text" id="m-phone" placeholder="+86 138 0000 0000"></div>
      <div class="f"><label for="m-rec">辅助邮箱</label><input class="inp" type="text" id="m-rec" placeholder="选填"></div>
      <div class="f full"><label for="m-note">备注</label><input class="inp" type="text" id="m-note" placeholder="如：主力号 / 注册小号"></div>
      <div class="f full hint">系统不保存邮箱密码。手机号默认打码显示。</div>
    </div></div>
    <div class="dr-f"><button type="button" class="btn" data-close>取消</button><button class="btn btn-primary">确定</button></div></form>`);
  document.getElementById('mailForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const g = id => document.getElementById(id).value.trim(), addr = g('m-addr');
    const dom = (addr.split('@')[1] || '').split('.')[0].toLowerCase();
    emails.push({ id:'e' + Date.now(), addr, provider:{ gmail:'Gmail', outlook:'Outlook', hotmail:'Outlook', icloud:'iCloud', qq:'QQ 邮箱', '163':'网易邮箱' }[dom] || '其他', phone:g('m-phone'), recovery:g('m-rec'), note:g('m-note') });
    closeLayer(); render(); toast('添加成功');
  });
}

        <tr><td>4</td><td>Canva</td><td>Pro</td><td>new@gmail.com</td><td class="r">89.00</td><td>月</td><td style="color:var(--red)">2026-11-31</td><td>${tag('日期无效', 'red')}</td></tr>
      </tbody></table></div>

function openBell() {
  const al = alerts();
  layer(`<div class="mask" data-close style="background:transparent"></div><div class="pop" role="dialog" aria-label="到期提醒"><div class="pop-h"><span>到期提醒</span><span class="t3" style="font-weight:400;font-size:12px">${settings.remindDays} 天内</span></div><div class="pop-b">
    ${al.map(s => `<div class="li" data-open="${s.id}">${blogo(s.name)}<div class="grow"><div class="nm">${esc(s.name)} ${esc(s.plan)}</div><div class="t3" style="font-size:12px">${fmt(s.next)} · ${yuan(s.price)}</div></div>${stag(s)}</div>`).join('') || '<div class="empty">暂无提醒</div>'}</div></div>`);
}

function renew(id) {
  const s = subs.find(x => x.id === id);
  s.history.push({ date:new Date(TODAY), amount:s.price });
  s.next = addCycle(s.next < TODAY ? TODAY : s.next, s.cycle, 1);
  return s;
}

function repaint(k) { if (k === 'subs') drawSubs(); else if (k === 'dhist') openDetail(curDetail); else render(); }
function layer(html) { document.getElementById('layer').innerHTML = html; const f = document.querySelector('#layer .icon-btn'); f && f.focus({ preventScroll:true }); }
function closeLayer() { document.getElementById('layer').innerHTML = ''; }
let tt;
function toast(t) { const el = document.getElementById('toast'); el.innerHTML = I('ok') + esc(t); el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2400); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-pick],[data-pickall],[data-nav],[data-open],[data-renew],[data-add],[data-edit],[data-close],[data-group],[data-mail],[data-addmail],[data-demo],[data-logout],[data-cancel],[data-convert],[data-cal],[data-reveal],[data-import],[data-bell],[data-burger],[data-batch],[data-skins],[data-skin],[data-htab],[data-pg],[data-note],[data-newnote],[data-ncolor],[data-delnote],[data-mnotes],[data-cancelflow],[data-paysubs],[data-unsnooze],[data-copy]');
  if (e.target.closest('a[target=_blank]')) return;
  if (!t) { if (!e.target.closest('.side,.burger')) document.getElementById('side').classList.remove('open'); return; }
  const d = t.dataset;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  if (d.pick) { picked.has(d.pick) ? picked.delete(d.pick) : picked.add(d.pick); drawSubs(); return; }
  if (d.pickall !== undefined) { const on = t.checked; document.querySelectorAll('[data-pick]').forEach(x => on ? picked.add(x.dataset.pick) : picked.delete(x.dataset.pick)); drawSubs(); return; }
  if (d.reveal) { shown.has(d.reveal) ? shown.delete(d.reveal) : shown.add(d.reveal); render(); return; }
  if (d.pg) { if (t.disabled) return; pg[d.pg].page = +d.p; repaint(d.pg); return; }
  if (d.cancelflow) { openCancelFlow(d.cancelflow); return; }
  if (d.paysubs) { const pm = payMethods.find(x => x.id === d.paysubs); filt.q = pm.name; filt.group = 'all'; filt.email = ''; if (pg.subs) pg.subs.page = 1; page = 'subs'; closeLayer(); render(); scrollTo(0, 0); return; }
  if (d.unsnooze !== undefined) { Object.keys(snoozed).forEach(k => delete snoozed[k]); render(); toast('已恢复全部提醒'); return; }
  if (d.copy) { const inp = document.getElementById(d.copy); try { navigator.clipboard.writeText(inp.value).then(() => toast('链接已复制'), () => { inp.select(); toast('已选中，按 Ctrl+C 复制'); }); } catch (err) { inp.select(); toast('已选中，按 Ctrl+C 复制'); } return; }
  if (d.note) { openNote(d.note); return; }
  if (d.newnote !== undefined) { const [ttype, tid] = (d.newnote || '').split(':'); openNote(null, tid ? { ttype, tid } : null); return; }
  if (d.ncolor !== undefined) { nfilt.color = d.ncolor; if (pg.notes) pg.notes.page = 1; render(); return; }
  if (d.delnote) { notes.splice(notes.findIndex(n => n.id === d.delnote), 1); closeLayer(); render(); toast('卡片已删除'); return; }
  if (d.mnotes) { nfilt.q = mailOf(d.mnotes).addr; nfilt.type = 'email'; page = 'notes'; render(); return; }
  if (d.nav) { page = d.nav; if (d.go) filt.group = d.go; document.getElementById('side').classList.remove('open'); closeLayer(); render(); scrollTo(0, 0); }
  else if (d.renew) { const s = renew(d.renew); closeLayer(); render(); toast(`已记录续费，下次扣费 ${fmt(s.next)}`); }
  else if (d.open) { if (pg.dhist) pg.dhist.page = 1; openDetail(d.open); }
  else if (d.add !== undefined) openForm();
  else if (d.edit) openForm(d.edit);
  else if (d.close !== undefined) closeLayer();
  else if (d.group) { filt.group = d.group; picked.clear(); if (pg.subs) pg.subs.page = 1; drawSubs(); }
  else if (d.mail) { filt.email = d.mail; filt.group = 'all'; page = 'subs'; render(); scrollTo(0, 0); }
  else if (d.addmail !== undefined) openMailForm();
  else if (d.import !== undefined) openImport();
  else if (d.htab) { homeTab = d.htab; render(); }
  else if (d.bell !== undefined) openBell();
  else if (d.skins !== undefined) openSkins();
  else if (d.skin) { skin = d.skin; try { localStorage.setItem('accountlist-skin', skin); } catch (err) {} applySkin(); openSkins(); }
  else if (d.burger !== undefined) document.getElementById('side').classList.toggle('open');
  else if (d.demo) toast(`原型演示：${d.demo}`);
  else if (d.logout !== undefined) document.getElementById('login').hidden = false;
  else if (d.cal) { const k = +d.cal; calMonth = k ? new Date(calMonth.getFullYear(), calMonth.getMonth() + k, 1) : new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); render(); }
  else if (d.cancel) { const s = subs.find(x => x.id === d.cancel); s.status = 'cancelled'; s.auto = false; closeLayer(); render(); toast('已标记为取消'); }
  else if (d.convert) { const s = subs.find(x => x.id === d.convert); s.trialEnd = null; closeLayer(); render(); toast('已转为正式订阅'); }
  else if (d.batch) {
    if (d.batch === 'renew') { let n = 0; picked.forEach(id => { const s = subs.find(x => x.id === id); if (isLive(s) && !s.trialEnd) { renew(id); n++; } }); toast(`已为 ${n} 项记录续费`); }
    if (d.batch === 'cancel') { picked.forEach(id => { const s = subs.find(x => x.id === id); if (isLive(s)) { s.status = 'cancelled'; s.auto = false; } }); toast('已标记为取消'); }
    picked.clear(); render();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'st-days') { settings.remindDays = Math.min(60, Math.max(1, +e.target.value || 7)); renderShell(); toast('已保存'); }
  if (e.target.dataset && e.target.dataset.snooze && e.target.value) { const sv = subs.find(x => x.id === e.target.dataset.snooze); snoozed[sv.id] = D(+e.target.value); render(); toast(`${sv.name} 将在 ${fmt(snoozed[sv.id])} 再次提醒`); return; }
  if (e.target.id === 'by') { billYear = +e.target.value; if (pg.bills) pg.bills.page = 1; render(); }
  if (e.target.dataset && e.target.dataset.pgsize) { const k = e.target.dataset.pgsize; pg[k].size = +e.target.value; pg[k].page = 1; repaint(k); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape') { closeLayer(); document.getElementById('side').classList.remove('open'); } });
document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); document.getElementById('login').hidden = true; toast('登录成功'); });

const tipEl = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tipEl.hidden = true; return; }
  tipEl.innerHTML = t.dataset.tip.split('｜').map((x, i) => i ? `<div>${esc(x)}</div>` : `<b>${esc(x)}</b>`).join('');
  tipEl.style.left = e.clientX + 'px'; tipEl.style.top = e.clientY + 'px'; tipEl.hidden = false;
});
applySkin();
render();
</script>
